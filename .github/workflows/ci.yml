name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/ruff format --check src tests scripts
      - run: .venv/bin/pyright
      - run: .venv/bin/python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "frontend=$([ -f frontend/package-lock.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.frontend == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.present.outputs.frontend == 'yes'
        run: npm ci
      - if: steps.present.outputs.frontend == 'yes'
        run: npm run build
      - if: steps.present.outputs.frontend == 'yes'
        run: npm test --if-present
