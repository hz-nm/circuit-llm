name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NGSPICE_VERSION: "47"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch ngspice (Windows, bundled)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p vendor/ngspice
          curl -fL -o vendor/ngspice/ngspice.7z \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}_64.7z/download"
          tar -xf vendor/ngspice/ngspice.7z -C vendor/ngspice

      - name: Install backend
        shell: bash
        run: |
          python -m venv backend/.venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=backend/.venv/Scripts/python; else PY=backend/.venv/bin/python; fi
          $PY -m pip install -e "backend[package]"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Build bundle
        shell: bash
        run: $PY packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: circuits-llm-${{ runner.os }}
          path: dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
