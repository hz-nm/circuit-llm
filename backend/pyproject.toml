[project]
name = "circuits-llm"
version = "0.1.0"
description = "Design and simulate electronic circuits by chatting with an LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "platformdirs>=4.2",
]

[project.scripts]
circuits-llm = "circuits_llm.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
]
package = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuits_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "ASYNC", "S"]
ignore = ["S101"]  # assert is used deliberately for internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/circuits_llm/domain/units.py" = ["RUF001", "RUF003"]  # intentional Unicode (Ω, µ, thin space)

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
